services:
  db-test2:
    image: postgres:16.1
    ports:
      - "5433:5432"
    volumes:
      - ./volumes/postgres-test2:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=test2
      - POSTGRES_USER=test2
      - POSTGRES_PASSWORD=test2
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10